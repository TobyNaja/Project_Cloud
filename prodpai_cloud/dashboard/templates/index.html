<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prodpai Cloud - Infrastructure</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist-mono@5/index.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: 'var(--bg)', surface: 'var(--surface)', raised: 'var(--raised)',
                        line: 'var(--line)', ink: 'var(--ink)', muted: 'var(--muted)',
                        accent: 'var(--accent)', 'accent-ink': 'var(--accent-ink)',
                        ok: 'var(--ok)', warn: 'var(--warn)', idle: 'var(--idle)'
                    },
                    fontFamily: {
                        sans: ['"Geist Variable"', 'Geist', 'system-ui', 'sans-serif'],
                        mono: ['"Geist Mono Variable"', '"Geist Mono"', 'ui-monospace', 'monospace']
                    }
                }
            }
        };
    </script>
    <style>
        :root {
            --bg: #f3f4f6; --surface: #fcfcfd; --raised: #eceef1; --line: #dde1e6;
            --ink: #14171c; --muted: #566070; --accent: #1f5fd6; --accent-ink: #fcfcfd;
            --ok: #0f7a56; --warn: #9a5800; --idle: #6b7482; color-scheme: light;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0b0d10; --surface: #12151a; --raised: #191d24; --line: #262c36;
                --ink: #e7eaee; --muted: #929ba8; --accent: #6aa5ff; --accent-ink: #0b0d10;
                --ok: #3ecf8e; --warn: #f0b429; --idle: #7a8492; color-scheme: dark;
            }
        }
        :root[data-theme="dark"] {
            --bg: #0b0d10; --surface: #12151a; --raised: #191d24; --line: #262c36;
            --ink: #e7eaee; --muted: #929ba8; --accent: #6aa5ff; --accent-ink: #0b0d10;
            --ok: #3ecf8e; --warn: #f0b429; --idle: #7a8492; color-scheme: dark;
        }
        body { background: var(--bg); color: var(--ink); }
        .num { font-variant-numeric: tabular-nums; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .press:active { transform: translateY(1px); }
        @media (prefers-reduced-motion: no-preference) {
            .spin { animation: spin 0.8s linear infinite; }
            .press { transition: background-color 0.15s, border-color 0.15s, transform 0.1s; }
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #diagram svg { max-width: 100%; height: auto; }
    </style>
</head>
<body class="font-sans min-h-[100dvh] antialiased">
    <header class="sticky top-0 z-20 border-b border-line bg-bg">
        <div class="max-w-[1400px] mx-auto px-4 lg:px-6 py-2 min-h-16 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 min-w-0">
                <i class="ph ph-cloud text-2xl text-accent" aria-hidden="true"></i>
                <div class="min-w-0">
                    <h1 class="text-base font-semibold leading-tight truncate">Prodpai Cloud Infrastructure</h1>
                    <p class="text-xs text-muted truncate">
                        Applied: <span id="applied-time" class="font-mono num text-ink">loading</span>
                        <span class="hidden sm:inline"> · Received: <span id="received-time" class="font-mono num text-ink">loading</span></span>
                    </p>
                </div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <span id="source-badge" class="hidden items-center rounded-full border border-line px-2.5 py-1 text-xs text-muted whitespace-nowrap"></span>
                <span id="conn" class="hidden md:inline-flex items-center gap-1.5 text-xs text-muted whitespace-nowrap">
                    <span id="conn-dot" class="h-1.5 w-1.5 rounded-full" style="background:var(--idle)"></span>
                    <span id="conn-text">Connecting</span>
                </span>
                <button id="refresh-btn" type="button" class="press inline-flex items-center gap-2 rounded-lg bg-accent text-accent-ink px-3 h-9 text-sm font-medium whitespace-nowrap">
                    <i id="refresh-icon" class="ph ph-arrows-clockwise text-base" aria-hidden="true"></i>
                    <span class="hidden sm:inline">Refresh</span>
                </button>
                <button id="theme-btn" type="button" aria-label="Switch color theme" class="press inline-flex items-center justify-center rounded-lg border border-line h-9 w-9 hover:bg-raised">
                    <i class="ph ph-circle-half text-base" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-[1400px] mx-auto px-4 lg:px-6 py-6 space-y-6">
        <div id="notice" class="hidden rounded-xl border border-line bg-surface px-4 py-3 text-sm flex items-start gap-3">
            <i id="notice-icon" class="ph ph-info text-lg text-accent mt-0.5" aria-hidden="true"></i>
            <div class="min-w-0">
                <p id="notice-title" class="font-medium"></p>
                <p id="notice-text" class="text-muted break-words"></p>
            </div>
        </div>
        <div id="error" class="hidden rounded-xl border border-warn bg-surface px-4 py-3 text-sm flex items-start gap-3">
            <i class="ph ph-warning text-lg text-warn mt-0.5" aria-hidden="true"></i>
            <p id="error-text" class="flex-1"></p>
            <button id="retry-btn" type="button" class="press underline underline-offset-2">Try again</button>
        </div>

        <!-- Context and summary -->
        <section aria-label="Summary" class="space-y-3">
            <div id="meta" class="flex flex-wrap gap-2 text-xs"></div>
            <div id="cards" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-3"></div>
        </section>

        <!-- Topology and raw data -->
        <section aria-label="Architecture" class="grid grid-cols-1 gap-4">
            <div class="rounded-xl border border-line bg-surface p-5 overflow-x-auto min-h-[600px]">
                <h2 class="text-sm font-semibold">Architecture diagram</h2>
                <div id="diagram" class="mt-4 flex justify-center text-sm text-muted">Loading diagram</div>
            </div>
            <div class="rounded-xl border border-line bg-surface p-5 flex flex-col max-h-[800px]">
                <h2 class="text-sm font-semibold">Incoming JSON data</h2>
                <pre id="json-log" class="mt-4 flex-1 overflow-auto rounded-lg bg-bg border border-line p-3 text-xs font-mono whitespace-pre-wrap break-words">Waiting for data</pre>
            </div>
        </section>

        <!-- Resource table (same data as the diagram) -->
        <section aria-label="Resources" class="rounded-xl border border-line bg-surface p-5">
            <div class="flex items-baseline justify-between gap-3 flex-wrap">
                <h2 class="text-sm font-semibold">Resources</h2>
                <p class="text-xs text-muted">Statuses marked <span class="font-medium text-ink">assumed</span> were not reported by Terraform or AWS.</p>
            </div>
            <div class="mt-4 overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="text-xs text-muted text-left">
                        <tr class="border-b border-line">
                            <th class="py-2 pr-4 font-medium">Name</th>
                            <th class="py-2 pr-4 font-medium">Type</th>
                            <th class="py-2 pr-4 font-medium">Status</th>
                            <th class="py-2 pr-4 font-medium">AZ</th>
                            <th class="py-2 pr-4 font-medium">IP</th>
                            <th class="py-2 pr-4 font-medium">Endpoint</th>
                            <th class="py-2 pr-4 font-medium">Spec</th>
                            <th class="py-2 font-medium">ID</th>
                        </tr>
                    </thead>
                    <tbody id="resource-rows">
                        <tr><td colspan="8" class="py-6 text-center text-muted">No data</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <p id="checked" class="text-xs text-muted num"></p>
        <div id="live" class="sr-only" aria-live="polite"></div>
    </main>

    <script type="module">
        const HEALTH_COLOR = { healthy: 'var(--ok)', warning: 'var(--warn)', inactive: 'var(--idle)', unknown: 'var(--idle)' };
        const $ = (id) => document.getElementById(id);
        const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

        const state = { data: null, version: null, busy: false, timer: null, diagramRun: 0 };

        const STATE_UI = {
            live: { icon: 'ph-info', tone: 'accent' },
            waiting: { icon: 'ph-hourglass', tone: 'accent' },
            writing: { icon: 'ph-arrows-clockwise', tone: 'accent', spin: true },
            invalid: { icon: 'ph-warning', tone: 'warn' },
            schema: { icon: 'ph-warning', tone: 'warn' }
        };
        const SOURCE_LABEL = { live: 'Live data', stale: 'Previous data', mock: 'SAMPLE DATA', none: 'No data' };
        const TYPE_LABEL = {
            aws_vpc: 'VPC', aws_subnet: 'Subnet', aws_internet_gateway: 'Internet gateway',
            aws_nat_gateway: 'NAT gateway', aws_lb: 'Load balancer', aws_lb_target_group: 'Target group',
            aws_wafv2_web_acl: 'WAF', aws_security_group: 'Security group', aws_autoscaling_group: 'Auto Scaling group',
            aws_launch_template: 'Launch template', aws_instance: 'EC2 instance', aws_lambda_function: 'Lambda',
            aws_cloudwatch_log_group: 'CloudWatch log group', aws_s3_bucket: 'S3 bucket', aws_db_instance: 'RDS'
        };

        const obj = (v) => (v && typeof v === 'object' && !Array.isArray(v) ? v : {});
        const text = (v, fallback = '') => (v === null || v === undefined || typeof v === 'object' ? fallback : String(v));
        const num = (v) => (typeof v === 'number' && Number.isFinite(v) ? v : 0);

        function sanitize(input) {
            const d = obj(input);
            const resources = (Array.isArray(d.resources) ? d.resources : [])
                .filter((r) => r && typeof r === 'object' && !Array.isArray(r))
                .map((r) => ({
                    id: text(r.id, 'unknown'),
                    name: text(r.name, text(r.id, 'unnamed')),
                    type: text(r.type, 'unknown'),
                    category: text(r.category, 'Other'),
                    role: text(r.role),
                    status: text(r.status, 'unknown'),
                    status_assumed: r.status_assumed === true,
                    health: HEALTH_COLOR[r.health] ? r.health : 'unknown',
                    az: text(r.az),
                    ips: (Array.isArray(r.ips) ? r.ips : []).map((ip) => text(ip)).filter(Boolean),
                    endpoint: text(r.endpoint),
                    tags: Object.fromEntries(Object.entries(obj(r.tags)).map(([k, v]) => [k, text(v)])),
                    spec: text(r.spec),
                    monthly_cost: num(r.monthly_cost)
                }));
            const s = obj(d.summary), h = obj(s.health), m = obj(d.meta);
            return {
                state: STATE_UI[d.state] ? d.state : 'waiting',
                source: SOURCE_LABEL[d.source] ? d.source : 'none',
                version: text(d.version, String(Date.now())),
                message: text(d.message), detail: text(d.detail),
                applied_at: text(d.applied_at), received_at: text(d.received_at),
                storage: text(d.storage),
                meta: { project: text(m.project), environment: text(m.environment), region: text(m.region) },
                summary: {
                    total: num(s.total), monthly_cost: num(s.monthly_cost), assumed: num(s.assumed_status),
                    health: { healthy: num(h.healthy), warning: num(h.warning), inactive: num(h.inactive), unknown: num(h.unknown) }
                },
                resources,
                raw: d.raw === undefined ? null : d.raw
            };
        }

        // ---------- data loading & SSE ----------
        async function load(manual = false) {
            if (state.busy) { state.again = true; return; }
            state.busy = true;
            $('refresh-icon').classList.add('spin');
            try {
                const headers = state.version && !manual ? { 'If-None-Match': state.version } : {};
                const res = await fetch('/api/data', { headers, cache: 'no-store' });
                if (res.status !== 304) {
                    if (!res.ok) throw new Error(`The server responded with status ${res.status}.`);
                    const data = sanitize(await res.json());
                    const changed = state.version !== null && data.version !== state.version;
                    state.data = data;
                    state.version = data.version;
                    render();
                    if (changed) {
                        $('live').textContent = data.state === 'live' ? 'Data updated.' : data.message;
                    }
                }
                $('error').classList.add('hidden');
                $('checked').textContent = `Data checked at ${new Date().toLocaleTimeString()}. Auto-updates are active.`;
            } catch (err) {
                const detail = err instanceof TypeError ? 'Server unreachable.' : err.message;
                $('error-text').textContent = `Could not load data. ${detail}`;
                $('error').classList.remove('hidden');
            } finally {
                state.busy = false;
                $('refresh-icon').classList.remove('spin');
                if (state.again) { state.again = false; load(false); }
            }
        }

        function setConnection(live) {
            $('conn-dot').style.background = live ? 'var(--ok)' : 'var(--warn)';
            $('conn-text').textContent = live ? 'Watching for updates' : 'Reconnecting';
        }

        function connect() {
            if (!window.EventSource) {
                $('conn-text').textContent = 'Polling every 5s';
                setInterval(() => load(false), 5000);
                return;
            }
            const source = new EventSource('/api/events');
            source.onopen = () => { setConnection(true); load(false); };
            source.addEventListener('change', () => load(false));
            source.onerror = () => setConnection(false);
        }

        // ---------- helpers ----------
        function formatTime(value) {
            if (!value) return 'No data';
            const t = new Date(value);
            return Number.isNaN(t.getTime()) ? value : t.toLocaleString();
        }

        function el(tag, className, content) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (content !== undefined) node.textContent = content;
            return node;
        }

        const isBuilder = (r) => r.role === 'ami-builder';
        const statusText = (r) => (r.status_assumed ? `${r.status} (assumed)` : r.status);

        // ---------- rendering ----------
        function render() {
            try { renderHeader(); } catch (err) { console.error(err); }
            try { renderSummary(); } catch (err) { console.error(err); }
            try { renderRaw(); } catch (err) { console.error(err); }
            try { renderTable(); } catch (err) { console.error(err); }
            try { renderDiagram(); } catch (err) { console.error(err); }
        }

        function renderHeader() {
            const d = state.data;
            $('applied-time').textContent = formatTime(d.applied_at);
            $('received-time').textContent = formatTime(d.received_at);
            const badge = $('source-badge');
            badge.textContent = SOURCE_LABEL[d.source];
            badge.classList.remove('hidden');
            badge.classList.add('inline-flex');
            const alert = d.source === 'mock' || d.source === 'stale';
            badge.style.borderColor = alert ? 'var(--warn)' : '';
            badge.style.color = alert ? 'var(--warn)' : '';

            const ui = STATE_UI[d.state];
            $('notice-icon').className = `ph ${ui.icon} text-lg mt-0.5${ui.spin ? ' spin' : ''}`;
            $('notice-icon').style.color = `var(--${ui.tone})`;
            $('notice-title').textContent = d.message;
            $('notice-text').textContent = d.detail;
            $('notice').classList.toggle('hidden', !d.message && !d.detail);
        }

        function renderSummary() {
            const d = state.data, s = d.summary;
            const meta = $('meta');
            meta.replaceChildren();
            const chips = [
                ['Project', d.meta.project], ['Environment', d.meta.environment],
                ['Region', d.meta.region], ['Storage', d.storage]
            ];
            for (const [label, value] of chips) {
                if (!value) continue;
                const chip = el('span', 'inline-flex items-center gap-1.5 rounded-full border border-line bg-surface px-2.5 py-1');
                chip.append(el('span', 'text-muted', label), el('span', 'font-mono text-ink', value));
                meta.append(chip);
            }

            const members = d.resources.filter((r) => r.type === 'aws_instance' && !isBuilder(r));
            const running = members.filter((r) => r.status === 'running').length;
            const cards = [
                ['Resources', String(s.total), 'var(--ink)'],
                ['Healthy', String(s.health.healthy), 'var(--ok)'],
                ['Warning', String(s.health.warning), s.health.warning ? 'var(--warn)' : 'var(--ink)'],
                ['ASG instances running', `${running} / ${members.length}`, members.length && running === members.length ? 'var(--ok)' : 'var(--warn)'],
                ['Status not live-checked', String(s.assumed), 'var(--ink)'],
                ['Est. monthly cost', `$${s.monthly_cost.toFixed(2)}`, 'var(--ink)']
            ];
            const box = $('cards');
            box.replaceChildren();
            for (const [label, value, color] of cards) {
                const card = el('div', 'rounded-xl border border-line bg-surface px-4 py-3');
                const v = el('p', 'text-xl font-semibold num font-mono', d.resources.length ? value : '—');
                v.style.color = d.resources.length ? color : 'var(--muted)';
                card.append(el('p', 'text-xs text-muted', label), v);
                box.append(card);
            }
        }

        function renderRaw() {
            const raw = state.data.raw;
            $('json-log').textContent = raw === null ? 'No data received yet.' : JSON.stringify(raw, null, 2);
        }

        function renderTable() {
            const rows = $('resource-rows');
            rows.replaceChildren();
            const list = [...state.data.resources].sort((a, b) =>
                a.category.localeCompare(b.category) || a.type.localeCompare(b.type) || a.name.localeCompare(b.name));
            if (!list.length) {
                const tr = el('tr');
                const td = el('td', 'py-6 text-center text-muted', 'No data');
                td.colSpan = 8;
                tr.append(td);
                rows.append(tr);
                return;
            }
            for (const r of list) {
                const tr = el('tr', 'border-b border-line last:border-0 align-top');
                const name = el('td', 'py-2 pr-4');
                name.append(el('span', 'font-medium', r.name));
                if (r.role) name.append(el('span', 'block text-xs text-muted', r.role));
                const status = el('td', 'py-2 pr-4 whitespace-nowrap');
                const dot = el('span', 'inline-block h-2 w-2 rounded-full mr-2 align-middle');
                dot.style.background = HEALTH_COLOR[r.health];
                status.append(dot, el('span', r.status_assumed ? 'text-muted' : '', statusText(r)));
                tr.append(
                    name,
                    el('td', 'py-2 pr-4 whitespace-nowrap', TYPE_LABEL[r.type] || r.type),
                    status,
                    el('td', 'py-2 pr-4 font-mono text-xs', r.az || '—'),
                    el('td', 'py-2 pr-4 font-mono text-xs', r.ips.join(', ') || '—'),
                    el('td', 'py-2 pr-4 font-mono text-xs break-all', r.endpoint || '—'),
                    el('td', 'py-2 pr-4 text-xs', r.spec || '—'),
                    el('td', 'py-2 font-mono text-xs break-all text-muted', r.id)
                );
                rows.append(tr);
            }
        }

        function diagramDefinition(resources) {
            const of = (type) => resources.filter((r) => r.type === type);
            const label = (v) => String(v ?? '').replace(/["`<>{}\[\]()|#;]/g, ' ').trim();
            const lines = ['graph TD'];
            const cls = (id, r) => lines.push(`class ${id} ${r.health}`);

            const vpc = of('aws_vpc')[0], igw = of('aws_internet_gateway')[0], waf = of('aws_wafv2_web_acl')[0];
            const lb = of('aws_lb')[0], tg = of('aws_lb_target_group')[0];
            const asg = of('aws_autoscaling_group')[0], lt = of('aws_launch_template')[0];
            const subnets = of('aws_subnet');
            const pub = subnets.filter((s) => s.tags.Tier === 'public');
            const priv = subnets.filter((s) => s.tags.Tier !== 'public');
            const nats = of('aws_nat_gateway');
            const instances = of('aws_instance');
            const members = instances.filter((r) => !isBuilder(r)), builders = instances.filter(isBuilder);
            const sgs = of('aws_security_group'), lambdas = of('aws_lambda_function'), logs = of('aws_cloudwatch_log_group');
            const buckets = of('aws_s3_bucket');
            const subnetNode = (id, s) => `${id}(["${label(s.name)}<br/>${label(s.spec)} · ${label(s.az)}"])`;
            const instStatus = (r) => label(statusText(r));

            lines.push('NET(("Internet"))');
            // ห้ามใช้รูปทรงวงเล็บปีกกาคู่ของ mermaid: ไฟล์นี้ผ่าน Jinja ซึ่งจะตีความว่าเป็น expression
            if (waf) lines.push(`WAF["AWS WAF<br/>${label(waf.name)}<br/>${label(waf.spec)}"]`);
            if (asg) lines.push(`ASG[["Auto Scaling group<br/>${label(asg.name)}<br/>${label(asg.spec)}"]]`);
            if (lt) lines.push(`LT["Launch template<br/>${label(lt.name)}"]`);

            lines.push(`subgraph VPC["VPC ${label(vpc ? `${vpc.name} ${vpc.spec}` : '')}"]`);
            if (igw) lines.push(`IGW["Internet gateway<br/>${label(igw.name)}"]`);
            lines.push('subgraph PUB["Public subnets"]');
            pub.forEach((s, i) => lines.push(subnetNode(`SNP_${i}`, s)));
            if (lb) lines.push(`ALB["Load balancer<br/>${label(lb.name)}<br/>${label(lb.spec)}"]`);
            nats.forEach((n, i) => lines.push(`NAT_${i}["NAT gateway<br/>${label(n.name)}<br/>${label(n.ips.join(' / '))}"]`));
            builders.forEach((r, i) => lines.push(`BLD_${i}["AMI builder<br/>${label(r.name)}<br/>${label(r.id)}<br/>${instStatus(r)}"]`));
            lines.push('end');
            if (tg) lines.push(`TG["Target group<br/>${label(tg.name)}<br/>${label(tg.spec)}"]`);
            lines.push('subgraph PRIV["Private subnets"]');
            priv.forEach((s, i) => lines.push(subnetNode(`SNQ_${i}`, s)));
            members.forEach((r, i) => lines.push(`EC2_${i}["EC2<br/>${label(r.id)}<br/>${label(r.ips.join(', '))}<br/>${instStatus(r)}"]`));
            if (!members.length) lines.push('EC2_NONE["No ASG instances reported"]');
            lines.push('end');
            if (sgs.length) {
                lines.push('subgraph SG["Security groups"]');
                sgs.forEach((r, i) => lines.push(`SG_${i}["${label(r.name)}<br/>${label(r.id)}"]`));
                lines.push('end');
            }
            lines.push('end');

            // traffic path
            let entry = 'NET';
            if (igw) { lines.push('NET --> IGW'); entry = 'IGW'; }
            if (lb) { lines.push(`${entry} -->|HTTP :80| ALB`); entry = 'ALB'; }
            if (waf && lb) lines.push('WAF -.->|filters| ALB');
            if (tg) { lines.push(`${entry} --> TG`); entry = 'TG'; }
            members.forEach((r, i) => { if (r.health !== 'inactive') lines.push(`${entry} --> EC2_${i}`); });
            if (asg) lines.push('ASG -.->|manages| PRIV');
            if (lt && asg) lines.push('LT -.->|template| ASG');
            builders.forEach((_, i) => { if (lt) lines.push(`BLD_${i} -.->|AMI| LT`); });
            nats.forEach((_, i) => {
                lines.push(`PRIV -.->|egress| NAT_${i}`);
                if (igw) lines.push(`NAT_${i} -.-> IGW`);
            });
            sgs.forEach((r, i) => {
                if (r.name === 'alb' && lb) lines.push(`SG_${i} -.- ALB`);
                if (r.name === 'instance') lines.push(`SG_${i} -.- PRIV`);
            });

            // security automation
            logs.forEach((r, i) => {
                lines.push(`LOG_${i}[("CloudWatch logs<br/>${label(r.name)}")]`, `PRIV -.->|Falco alerts| LOG_${i}`);
            });
            lambdas.forEach((r, i) => {
                lines.push(`FN_${i}["Lambda<br/>${label(r.name)}<br/>${label(r.spec)}"]`);
                logs.forEach((_, j) => lines.push(`LOG_${j} -->|Critical alert| FN_${i}`));
                sgs.forEach((sg, j) => { if (sg.name === 'quarantine') lines.push(`FN_${i} -.->|isolates with| SG_${j}`); });
            });
            if (buckets.length) {
                lines.push('subgraph S3["S3 buckets"]');
                buckets.forEach((r, i) => lines.push(`BKT_${i}[("${label(r.name)}")]`));
                lines.push('end');
            }

            // health colours
            const ok = cssVar('--ok'), warn = cssVar('--warn'), idle = cssVar('--idle');
            lines.push(`classDef healthy stroke:${ok},stroke-width:2px`);
            lines.push(`classDef warning stroke:${warn},stroke-width:2px`);
            lines.push(`classDef inactive stroke:${idle},stroke-dasharray:4 3,color:${idle}`);
            lines.push(`classDef unknown stroke:${idle},stroke-width:1px`);
            members.forEach((r, i) => cls(`EC2_${i}`, r));
            builders.forEach((r, i) => cls(`BLD_${i}`, r));
            return lines.join('\n');
        }

        let mermaidModule = null;
        async function renderDiagram() {
            const el = $('diagram'), run = ++state.diagramRun;
            if (!state.data.resources.length) { el.textContent = 'No infrastructure data. Nothing to draw.'; return; }
            try {
                if (!mermaidModule) {
                    mermaidModule = (await import('https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs')).default;
                }
                const dark = cssVar('--bg') === '#0b0d10';
                mermaidModule.initialize({ startOnLoad: false, securityLevel: 'strict', theme: dark ? 'dark' : 'neutral' });
                const { svg } = await mermaidModule.render(`diagram-svg-${run}`, diagramDefinition(state.data.resources));
                if (run === state.diagramRun) el.innerHTML = svg;
            } catch (err) {
                console.error('Diagram rendering failed:', err);
                if (run === state.diagramRun) el.textContent = 'Diagram rendering failed. See console for details.';
            }
        }

        // ---------- interactions ----------
        $('refresh-btn').addEventListener('click', () => load(true));
        $('retry-btn').addEventListener('click', () => load(true));
        $('theme-btn').addEventListener('click', () => {
            const dark = cssVar('--bg') === '#0b0d10';
            const next = dark ? 'light' : 'dark';
            document.documentElement.dataset.theme = next;
            try { localStorage.setItem('theme', next); } catch (_) {}
            if (state.data) renderDiagram();
        });

        try {
            const saved = localStorage.getItem('theme');
            if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
        } catch (_) {}

        load(true);
        connect();
    </script>
</body>
</html>
